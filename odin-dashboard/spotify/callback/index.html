<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Odin Dashboard · Spotify-Anmeldung</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0a0d0f;
      color: #eef3ef;
      font-family: "Bahnschrift", "DIN Alternate", sans-serif;
    }
    main {
      width: min(620px, 100%);
      border-left: 4px solid #1ed760;
      background: #12181b;
      padding: clamp(28px, 8vw, 64px);
    }
    .label {
      margin: 0 0 18px;
      color: #1ed760;
      font: 600 12px/1.4 "Cascadia Mono", monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Rockwell", "Roboto Slab", serif;
      font-size: clamp(38px, 9vw, 64px);
      font-weight: 500;
      line-height: 1;
    }
    p { margin: 24px 0 0; color: #9aabaa; font-size: 17px; line-height: 1.6; }
    a {
      display: inline-flex;
      min-height: 52px;
      margin-top: 28px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid #1ed760;
      background: #1ed760;
      color: #0a0d0f;
      font: 600 16px/1 "Bahnschrift", "DIN Alternate", sans-serif;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #eef3ef; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Spotify-Rückkehr</p>
    <h1>Zurück zu Odin Dashboard</h1>
    <p>
      Die Spotify-Anmeldung ist abgeschlossen. Odin Dashboard sollte sich
      automatisch öffnen. Falls der Browser diese Seite anzeigt, öffne die App
      mit diesem Knopf. Teile die Adresse dieser Seite nicht.
    </p>
    <a id="open-app" href="#" rel="nofollow">Odin Dashboard öffnen</a>
  </main>
  <script>
    (() => {
      const packageName = "de.joergensen.odindashboard";
      // GitHub Pages canonicalizes this directory URL with a trailing slash,
      // while Spotify and the installed Android app use the registered URI
      // without it. Keep the OAuth query intact but target that exact app link.
      const callbackPath = "/odin-dashboard/spotify/callback";
      const target =
        `intent://${window.location.host}${callbackPath}${window.location.search}` +
        `#Intent;scheme=https;package=${packageName};` +
        "action=android.intent.action.VIEW;" +
        "category=android.intent.category.BROWSABLE;end";
      const openApp = document.getElementById("open-app");
      openApp.href = target;
      window.setTimeout(() => { window.location.href = target; }, 250);
    })();
  </script>
</body>
</html>
