<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Odin Dashboard · Anmeldung</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0a0d0f;
      color: #eef3ef;
      font-family: "Bahnschrift", "DIN Alternate", sans-serif;
    }
    main {
      width: min(620px, 100%);
      border-left: 4px solid #d5a23d;
      background: #12181b;
      padding: clamp(28px, 8vw, 64px);
    }
    .label {
      margin: 0 0 18px;
      color: #d5a23d;
      font: 600 12px/1.4 "Cascadia Mono", monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Rockwell", "Roboto Slab", serif;
      font-size: clamp(38px, 9vw, 64px);
      font-weight: 500;
      line-height: 1;
    }
    p { margin: 24px 0 0; color: #9aabaa; font-size: 17px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="label">OAuth-Rückkehr</p>
    <h1>Zurück zu Odin Dashboard</h1>
    <p>
      Öffne Odin Dashboard erneut. Wenn diese Seite nach einer Anmeldung
      sichtbar bleibt, ist der Android App Link auf diesem Gerät noch nicht
      verifiziert. Starte die Anmeldung nicht mehrfach und teile die Adresse
      dieser Seite nicht.
    </p>
  </main>
</body>
</html>
